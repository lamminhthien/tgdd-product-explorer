<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TGDD Product Explorer</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1d1d1f; --muted: #6e6e73;
    --line: #e5e5ea; --accent: #0071e3; --star: #f5a623; --danger: #d70015;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--text); }
  header { background: var(--card); border-bottom: 1px solid var(--line); padding: 16px; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  form { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
  label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 4px; }
  input, select, button { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  input[type=text], input[type=number] { width: 150px; }
  button { background: var(--accent); color: #fff; border: none; cursor: pointer; }
  button.ghost { background: #fff; color: var(--text); border: 1px solid var(--line); }
  button:disabled { opacity: .5; cursor: default; }
  .tabs { display: flex; gap: 4px; margin: 16px 0; }
  .tab { background: transparent; color: var(--muted); border-radius: 8px 8px 0 0; }
  .tab.active { background: var(--card); color: var(--text); font-weight: 600; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .hidden { display: none !important; }
  .status { color: var(--muted); padding: 8px 0; }
  .error { color: var(--danger); padding: 8px 0; white-space: pre-wrap; }
  .hero { display: grid; grid-template-columns: 220px 1fr; gap: 20px; }
  .hero img { width: 100%; border-radius: 8px; background: #fafafa; }
  .price { font-size: 22px; font-weight: 700; color: var(--danger); }
  .old { text-decoration: line-through; color: var(--muted); margin-left: 8px; }
  .badge { display: inline-block; background: #e8f5e9; color: #1b5e20; padding: 2px 8px; border-radius: 999px; font-size: 12px; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-top: 16px; }
  .gallery img { width: 100%; border-radius: 8px; border: 1px solid var(--line); }
  h2 { font-size: 16px; margin: 24px 0 8px; }
  table { width: 100%; border-collapse: collapse; }
  td { border-bottom: 1px solid var(--line); padding: 6px 8px; vertical-align: top; }
  td.k { color: var(--muted); width: 38%; }
  .group { font-weight: 600; background: #fafafa; }
  .articles img { max-width: 100%; height: auto; }
  .articles { overflow-x: auto; }
  .summary { display: grid; grid-template-columns: 180px 1fr; gap: 24px; align-items: center; }
  .big { font-size: 40px; font-weight: 700; }
  .stars { color: var(--star); letter-spacing: 1px; }
  .bar { display: grid; grid-template-columns: 22px 1fr 48px; gap: 8px; align-items: center; font-size: 12px; margin: 4px 0; }
  .bar div:nth-child(2) { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--star); }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; align-items: center; }
  .review { border-top: 1px solid var(--line); padding: 12px 0; }
  .review:first-child { border-top: none; }
  .meta { color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
  .reply { background: #f5f5f7; border-radius: 8px; padding: 8px; margin-top: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .chip { background: #fff; color: var(--text); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
  .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
  .product-card { text-align: left; background: var(--card); color: var(--text); border: 1px solid var(--line);
                  border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 4px; }
  .product-card:hover { border-color: var(--accent); }
  .product-card img { width: 100%; aspect-ratio: 1; object-fit: contain; background: #fafafa; border-radius: 8px; }
  .product-card .pname { font-weight: 600; font-size: 13px; }
  .product-card .price { font-size: 15px; }
  .product-card .meta { font-size: 12px; }
  .range-group { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .range-group input { width: 90px; }
  .seg { display: flex; }
  .seg button { border-radius: 0; }
  .seg button:first-child { border-radius: 8px 0 0 8px; }
  .seg button:last-child { border-radius: 0 8px 8px 0; }
  .seg button + button { margin-left: -1px; }
  .ghost.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .icon { background: transparent; color: var(--muted); padding: 2px 6px; font-size: 12px; line-height: 1.2; border-radius: 6px; }
  .icon.on { color: var(--accent); background: #e8f0fe; }
  .sentinel { justify-content: center; padding: 16px 0 4px; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
  .product-table { min-width: 960px; font-size: 13px; }
  .product-table th { text-align: left; background: #fafafa; color: var(--muted); font-weight: 600; font-size: 12px;
                      padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .product-table td { white-space: nowrap; }
  .product-table td:first-child { white-space: normal; min-width: 240px; }
  .product-table td.num { text-align: right; }
  .product-table td img { width: 40px; height: 40px; object-fit: contain; vertical-align: middle; margin-right: 8px;
                          border-radius: 6px; background: #fafafa; }
  .product-table tbody tr { cursor: pointer; }
  .product-table tbody tr:hover { background: #f5f8ff; }
  .th-head { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .th-filter { margin-top: 6px; font-weight: 400; }
  .th-filter input, .th-filter select { width: 100%; min-width: 0; padding: 4px 6px; font-size: 12px; }
  .th-filter .range-group { flex-direction: column; align-items: stretch; gap: 4px; }
  .th-filter .range-group input { width: 100%; }
  .th-filter .range-group span { display: none; }
  @media (max-width: 640px) {
    .hero, .summary { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap" style="padding:0">
    <h1>TGDD Product Explorer · Chi tiết sản phẩm &amp; đánh giá</h1>
    <form id="search">
      <label>Product code
        <input type="text" id="productCode" value="0131491005165">
      </label>
      <label>Model code
        <input type="text" id="modelCode" value="201336">
      </label>
      <label>Seller ID
        <input type="number" id="sellerId" value="1" style="width:90px">
      </label>
      <label>Province ID
        <input type="number" id="provinceId" value="1027" style="width:90px">
      </label>
      <label>Nguồn dữ liệu
        <select id="source">
          <option value="live">Live (qua Node.js /api/tgdd)</option>
          <option value="har">Dữ liệu đã lưu từ HAR</option>
        </select>
      </label>
      <button type="submit" id="loadBtn">Tải dữ liệu</button>
    </form>
  </div>
</header>

<main class="wrap">
  <div class="tabs">
    <button class="tab active" data-tab="list">Danh sách sản phẩm</button>
    <button class="tab" data-tab="detail">Chi tiết sản phẩm</button>
    <button class="tab" data-tab="reviews">Đánh giá</button>
  </div>

  <div id="status" class="status"></div>
  <div id="error" class="error hidden"></div>

  <!-- Danh sách sản phẩm -->
  <section id="list" class="panel">
    <div class="filters">
      <input type="text" id="nameFilter" data-f="name" placeholder="Tìm theo tên sản phẩm" style="width:260px">
      <button class="ghost" id="reloadList">Tải lại</button>
      <div class="seg">
        <button class="ghost on" data-view="cards">Thẻ</button>
        <button class="ghost" data-view="table">Bảng</button>
      </div>
      <button class="ghost hidden" id="exportBtn">Xuất Excel</button>
      <span class="meta" id="listInfo"></span>
    </div>
    <div id="brandChips" class="chips"></div>
    <div class="filters">
      <div class="range-group"><span>Đã bán</span>
        <input type="number" min="0" data-f="sold.min" placeholder="Từ"><span>–</span>
        <input type="number" min="0" data-f="sold.max" placeholder="Đến">
      </div>
      <div class="range-group"><span>Lượt đánh giá</span>
        <input type="number" min="0" data-f="reviews.min" placeholder="Từ"><span>–</span>
        <input type="number" min="0" data-f="reviews.max" placeholder="Đến">
      </div>
      <div class="range-group"><span>Giá (triệu ₫)</span>
        <input type="number" min="0" step="0.1" data-f="price.min" placeholder="Từ"><span>–</span>
        <input type="number" min="0" step="0.1" data-f="price.max" placeholder="Đến">
      </div>
      <button class="ghost" id="clearFilters">Xóa bộ lọc</button>
    </div>
    <div id="productGrid" class="product-grid"></div>
    <div id="tableWrap" class="table-wrap hidden">
      <table class="product-table">
        <thead id="tableHead"></thead>
        <tbody id="productRows"></tbody>
      </table>
    </div>
    <div id="listSentinel" class="meta sentinel"></div>
  </section>

  <!-- Chi tiết -->
  <section id="detail" class="panel hidden">
    <div class="hero">
      <img id="thumb" alt="">
      <div>
        <div id="name" style="font-size:20px;font-weight:600"></div>
        <div style="margin:8px 0">
          <span class="price" id="price"></span><span class="old" id="oldPrice"></span>
          <span class="badge" id="percent"></span>
        </div>
        <div id="warranty" class="meta"></div>
        <div id="meta" class="meta" style="margin-top:8px"></div>
        <p><a id="detailUrl" href="#" target="_blank" rel="noopener">Xem trên thegioididong.com ↗</a></p>
      </div>
    </div>

    <h2>Hình ảnh</h2>
    <div id="gallery" class="gallery"></div>

    <h2>Thông số kỹ thuật</h2>
    <table id="specs"></table>

    <h2>Bài viết mô tả</h2>
    <div id="articles" class="articles"></div>
  </section>

  <!-- Đánh giá -->
  <section id="reviews" class="panel hidden">
    <div class="summary">
      <div>
        <div class="big" id="avgScore">–</div>
        <div class="stars" id="avgStars"></div>
        <div class="meta" id="totalRating"></div>
      </div>
      <div id="bars"></div>
    </div>

    <div class="filters">
      <label style="flex-direction:row;gap:6px;align-items:center;color:var(--text)">
        Số sao
        <select id="score">
          <option value="0">Tất cả</option>
          <option value="5">5 sao</option><option value="4">4 sao</option>
          <option value="3">3 sao</option><option value="2">2 sao</option><option value="1">1 sao</option>
        </select>
      </label>
      <label style="flex-direction:row;gap:6px;align-items:center;color:var(--text)">
        <input type="checkbox" id="hasImage"> Chỉ đánh giá có ảnh
      </label>
      <label style="flex-direction:row;gap:6px;align-items:center;color:var(--text)">
        Sắp xếp
        <select id="orderBy">
          <option value="1">Mới nhất</option>
          <option value="2">Hữu ích nhất</option>
        </select>
      </label>
      <button class="ghost" id="applyFilters">Áp dụng</button>
      <span class="meta" id="imageCount"></span>
    </div>

    <div id="reviewList"></div>
    <div style="margin-top:12px">
      <button class="ghost" id="loadMore">Tải thêm đánh giá</button>
    </div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const fmtVND = (n) => (n || 0).toLocaleString('vi-VN') + ' ₫';
const fmtDate = (s) => s ? new Date(s).toLocaleDateString('vi-VN') : '';
const PAGE_SIZE = 10;

const state = { reviewPage: 0, reviewsLoaded: 0, reviewTotal: 0, busy: false };

// ---------- Data access: live proxy or HAR fixtures ----------
const HAR_FILES = {
  'Product/GetProductExtend': 'data/product-extend.json',
  'Product/GetGalleryProduct': 'data/gallery.json',
  'Product/GetOldProductInfo': 'data/old-product-info.json',
  'Comment/Product/Code': 'data/comments.json',
  'Comment/GetComentImages': 'data/comment-images.json',
  'Cate/GetproductCateV2': 'data/product-list.json',
};

// Endpoint live bị lỗi và đang dùng HAR thay thế: endpoint -> thông báo lỗi.
const liveFallbacks = new Map();
const LIST_ENDPOINT = 'Cate/GetproductCateV2';

async function readHar(endpoint) {
  // HAR fixtures are static snapshots: filters and paging do not change them.
  const res = await fetch(HAR_FILES[endpoint]);
  if (!res.ok) throw new Error('Không đọc được ' + HAR_FILES[endpoint]);
  return res.json();
}

async function callLive(endpoint, { method, query, body }) {
  const qs = new URLSearchParams(query).toString();
  const url = `/api/tgdd/${endpoint}${qs ? '?' + qs : ''}`;
  const res = await fetch(url, {
    method,
    headers: method === 'POST' ? { 'Content-Type': 'application/json' } : {},
    body: method === 'POST' ? JSON.stringify(body) : undefined,
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(`${endpoint}: HTTP ${res.status} ${json.error || ''}`);
  if (json.code !== 0) throw new Error(`${endpoint}: code ${json.code} ${json.message || json.errormessage || ''}`);
  return json;
}

async function callApi(endpoint, { method = 'GET', query = {}, body } = {}) {
  if ($('source').value === 'har') return readHar(endpoint);
  try {
    const json = await callLive(endpoint, { method, query, body });
    liveFallbacks.delete(endpoint);
    return json;
  } catch (err) {
    // Live lỗi (ví dụ upstream chặn server): dùng HAR đã lưu và ghi nhận để hiển thị.
    if (!HAR_FILES[endpoint]) throw err;
    liveFallbacks.set(endpoint, err.message);
    return readHar(endpoint);
  }
}

// Thông báo khi chi tiết/đánh giá đang lấy từ HAR vì live lỗi; null nếu không có.
function detailFallbackNote() {
  const entry = [...liveFallbacks].find(([endpoint]) => endpoint !== LIST_ENDPOINT);
  if (!entry) return null;
  return `Live lỗi (${entry[1]}), đang hiển thị dữ liệu HAR đã lưu. Dữ liệu này là ảnh chụp cũ, có thể không khớp mã sản phẩm bạn nhập.`;
}

function setStatus(text) { $('status').textContent = text; }
function setError(text) { $('error').textContent = text; $('error').classList.toggle('hidden', !text); }

// ---------- Tabs ----------
document.querySelectorAll('.tab').forEach((btn) => btn.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('active', b === btn));
  ['list', 'detail', 'reviews'].forEach((id) => $(id).classList.toggle('hidden', btn.dataset.tab !== id));
}));

// ---------- Chi tiết sản phẩm ----------
// productArticles là HTML từ API: bỏ script, iframe và thuộc tính on* trước khi hiển thị.
function sanitize(html) {
  const doc = new DOMParser().parseFromString(html || '', 'text/html');
  doc.querySelectorAll('script,iframe,object,embed,link,meta').forEach((n) => n.remove());
  doc.querySelectorAll('*').forEach((el) => {
    [...el.attributes].forEach((a) => {
      if (a.name.startsWith('on')) el.removeAttribute(a.name);
      if (['href', 'src'].includes(a.name) && /^\s*javascript:/i.test(a.value)) el.removeAttribute(a.name);
    });
  });
  return doc.body.innerHTML;
}

function renderSpecs(templates) {
  const rows = [];
  (templates || []).forEach((g) => {
    rows.push(`<tr class="group"><td colspan="2">${escapeHtml(g.groupName)}</td></tr>`);
    (g.propertyList || []).forEach((p) => {
      const value = (p.valueList || []).map((v) => v.name).join(', ');
      rows.push(`<tr><td class="k">${escapeHtml(p.label)}</td><td>${escapeHtml(value)}</td></tr>`);
    });
  });
  $('specs').innerHTML = rows.join('') || '<tr><td>Không có thông số</td></tr>';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function loadDetail(productCode, modelCode, sellerId, provinceId) {
  const [info, extend, gallery] = await Promise.all([
    callApi('Product/GetOldProductInfo', {
      method: 'POST', body: { productCode, provinceId },
    }),
    callApi('Product/GetProductExtend', {
      query: { modelCode, productCode, sellerId, provinceId, districtId: 0, wardId: 0 },
    }),
    callApi('Product/GetGalleryProduct', {
      query: { productCode, modelCode, provinceId, districtId: 0, wardId: 0, SellerId: sellerId },
    }),
  ]);

  const p = info.data || {};
  $('thumb').src = p.thumbnail || '';
  $('name').textContent = p.productName || '';
  $('price').textContent = p.price ? fmtVND(p.price) : '';
  $('oldPrice').textContent = '';
  $('percent').textContent = p.percent ? `${p.percent}%` : '';
  $('warranty').textContent = p.warrantyInfo || '';
  $('detailUrl').href = p.detailUrl || '#';

  const ext = extend.data || {};
  $('articles').innerHTML = sanitize(ext.productArticles);
  renderSpecs(ext.specificationTemplate);

  const images = (gallery.data || []).flatMap((g) => g.lstItem || []);
  $('gallery').innerHTML = images.map((i) => `<img loading="lazy" src="${escapeHtml(i.url)}" alt="">`).join('');
  $('meta').innerHTML = `<span>Product code: ${escapeHtml(productCode)}</span><span>Model: ${escapeHtml(modelCode)}</span>`;
}

// ---------- Đánh giá ----------
function stars(n) {
  const full = Math.round(n || 0);
  return '★'.repeat(full) + '☆'.repeat(Math.max(0, 5 - full));
}

function renderSummary(sta) {
  if (!sta) return;
  $('avgScore').textContent = sta.scoreRating?.toFixed(1) ?? '–';
  $('avgStars').textContent = stars(sta.scoreRating);
  $('totalRating').textContent = `${(sta.totalRating || 0).toLocaleString('vi-VN')} đánh giá`;
  const rows = [5, 4, 3, 2, 1].map((s) => {
    const pct = sta[`score${s}Percentage`] || 0;
    return `<div class="bar"><span>${s}★</span><div><span style="width:${pct}%"></span></div><span>${pct.toFixed(0)}%</span></div>`;
  });
  $('bars').innerHTML = rows.join('');
}

function renderComment(c) {
  const reply = c.responseContent
    ? `<div class="reply"><strong>Phản hồi từ cửa hàng:</strong> ${escapeHtml(c.responseContent)}</div>` : '';
  const attached = (c.commentAttachedFileBOList || []).length;
  return `
    <div class="review">
      <div><strong>${escapeHtml(c.isAnonymous ? 'Khách ẩn danh' : c.fullName)}</strong>
        <span class="stars">${stars(c.score)}</span></div>
      <div class="meta">
        <span>${fmtDate(c.createdDate)}</span>
        ${c.hasRecommendProduct ? '<span class="badge">Có giới thiệu sản phẩm</span>' : ''}
        ${c.deliveryDate ? `<span>Nhận hàng: ${fmtDate(c.deliveryDate)}</span>` : ''}
        ${attached ? `<span>${attached} ảnh/video đính kèm</span>` : ''}
        <span>Mã SP: ${escapeHtml(c.productCode)}</span>
        <span>👍 ${c.likeCount}</span>
      </div>
      <p style="margin:6px 0 0">${escapeHtml(c.content)}</p>
      ${reply}
    </div>`;
}

async function fetchReviewPage(modelCode, page) {
  const filters = {
    pageIndex: page,
    pageSize: PAGE_SIZE,
    variantCode: '',
    productCode: '',
    score: Number($('score').value),
    orderBy: Number($('orderBy').value),
    hasImage: $('hasImage').checked ? 1 : 0,
    modelCode,
  };
  return callApi('Comment/Product/Code', { method: 'POST', body: filters });
}

async function loadReviews(modelCode, reset) {
  if (state.busy) return;
  state.busy = true;
  $('loadMore').disabled = true;
  try {
    if (reset) {
      state.reviewPage = 0;
      state.reviewsLoaded = 0;
      $('reviewList').innerHTML = '';
    }
    const data = (await fetchReviewPage(modelCode, state.reviewPage)).data || {};
    renderSummary(data.commentSta);
    state.reviewTotal = data.total || 0;
    const comments = data.comments || [];
    $('reviewList').insertAdjacentHTML('beforeend', comments.map(renderComment).join(''));
    state.reviewsLoaded += comments.length;
    state.reviewPage += 1;
    $('loadMore').disabled = state.reviewsLoaded >= state.reviewTotal || comments.length === 0;
    $('loadMore').textContent = `Tải thêm (${state.reviewsLoaded}/${state.reviewTotal})`;
    if (reset && comments.length === 0) $('reviewList').innerHTML = '<p class="meta">Chưa có đánh giá phù hợp bộ lọc.</p>';
  } finally {
    state.busy = false;
  }
}

async function loadImageCount(modelCode, productCode, sellerId, provinceId) {
  try {
    const res = await callApi('Comment/GetComentImages', {
      query: { pageIndex: 0, pageSize: 10, score: 0, modelCode },
    });
    $('imageCount').textContent = `${res.data?.totalImage ?? 0} ảnh đánh giá từ khách hàng`;
  } catch {
    $('imageCount').textContent = '';
  }
}

// ---------- Danh sách sản phẩm (điện thoại, danh mục cateId 13) ----------
const LIST_PAGE_SIZE = 20;
const list = { page: 0, products: [], seen: new Set(), done: false };
let listBusy = false;
let listView = 'cards';        // 'cards' | 'table'
let listSort = null;           // { key, dir: 'asc' | 'desc' } hoặc null
const openFilters = new Set(); // các cột đang mở ô lọc trong bảng

// "Đã bán 5,4k" → 5400; "Đã bán 398" → 398.
function parseSold(s) {
  const m = String(s ?? '').match(/(\d+(?:[.,]\d+)?)\s*(k|tr)?/i);
  if (!m) return 0;
  const unit = (m[2] || '').toLowerCase();
  return Math.round(Number(m[1].replace(',', '.')) * (unit === 'k' ? 1e3 : unit === 'tr' ? 1e6 : 1));
}

const priceOf = (p) => p.productPrices?.[0] || {};

// Cột của bảng. value: giá trị để sắp xếp, lọc và xuất Excel.
// scale: ô lọc nhập theo đơn vị khác (giá nhập theo triệu ₫).
const COLUMNS = [
  { key: 'name', label: 'Sản phẩm', type: 'text', value: (p) => p.name || '' },
  { key: 'brand', label: 'Thương hiệu', type: 'select', value: (p) => p.brand?.brandName || '' },
  { key: 'price', label: 'Giá bán', type: 'num', scale: 1e6, unit: 'triệu ₫', value: (p) => priceOf(p).price || 0, show: (p) => fmtVND(priceOf(p).price) },
  { key: 'sysPrice', label: 'Giá gốc', type: 'num', scale: 1e6, unit: 'triệu ₫', value: (p) => priceOf(p).sysPrice || 0, show: (p) => fmtVND(priceOf(p).sysPrice) },
  { key: 'discount', label: 'Giảm', type: 'num', unit: '%', value: (p) => priceOf(p).discountPercent || 0, show: (p) => `${priceOf(p).discountPercent || 0}%` },
  { key: 'sold', label: 'Đã bán', type: 'num', value: (p) => parseSold(p.totalSold), show: (p) => (p.totalSold || '').replace('Đã bán ', '') },
  { key: 'reviews', label: 'Lượt đánh giá', type: 'num', value: (p) => p.totalRate || 0, show: (p) => (p.totalRate || 0).toLocaleString('vi-VN') },
  { key: 'rate', label: 'Điểm', type: 'num', value: (p) => p.rate || 0, show: (p) => (p.rate ?? 0).toFixed(1) },
  { key: 'code', label: 'Mã SP', type: 'text', value: (p) => p.productCode || '' },
];

// Bộ lọc dùng chung cho cả hai chế độ xem. Cột chữ/chọn là chuỗi, cột số là { min, max } (null = không giới hạn).
const flt = {};
function resetFilters() {
  COLUMNS.forEach((c) => { flt[c.key] = c.type === 'num' ? { min: null, max: null } : ''; });
}
resetFilters();

function isActive(c) {
  const f = flt[c.key];
  return c.type === 'num' ? f.min != null || f.max != null : f !== '';
}

function matches(p) {
  return COLUMNS.every((c) => {
    const f = flt[c.key];
    const v = c.value(p);
    if (c.type === 'num') {
      const x = v / (c.scale || 1);
      return (f.min == null || x >= f.min) && (f.max == null || x <= f.max);
    }
    if (!f) return true;
    return c.type === 'select' ? v === f : normalize(v).includes(normalize(f));
  });
}

function visibleProducts() {
  const items = list.products.filter(matches);
  if (!listSort) return items;
  const col = COLUMNS.find((c) => c.key === listSort.key);
  const dir = listSort.dir === 'asc' ? 1 : -1;
  return items.sort((a, b) => {
    const x = col.value(a);
    const y = col.value(b);
    return (typeof x === 'number' ? x - y : String(x).localeCompare(String(y), 'vi')) * dir;
  });
}

function brandNames() {
  return [...new Set(list.products.map((p) => p.brand?.brandName).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'vi'));
}

// Bỏ dấu tiếng Việt để tìm kiếm không phân biệt dấu.
function normalize(s) {
  return String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
}

async function loadProducts(reset) {
  if (listBusy || (list.done && !reset)) return;
  listBusy = true;
  $('listSentinel').textContent = 'Đang tải thêm sản phẩm...';
  let failed = false;
  try {
    if (reset) Object.assign(list, { page: 0, products: [], seen: new Set(), done: false });
    if ($('source').value === 'har' && list.page > 0) {
      list.done = true; // Fixture HAR chỉ có một trang.
    } else {
      const res = await callApi('Cate/GetproductCateV2', {
        method: 'POST',
        body: {
          pageIndex: list.page + 1, pageSize: LIST_PAGE_SIZE, provinceId: Number($('provinceId').value),
          urlCate: 'dtdd', cateId: '13', filters: [],
        },
      });
      const items = res.data?.products || [];
      list.page += 1;
      items.forEach((p) => {
        if (!list.seen.has(p.productCode)) { list.seen.add(p.productCode); list.products.push(p); }
      });
      // HAR fallback chỉ có một trang nên dừng luôn, nếu không sẽ tải lặp cùng dữ liệu.
      list.done = items.length === 0 || liveFallbacks.has(LIST_ENDPOINT); // Thứ tự phân trang không ổn định, nên loại trùng theo productCode.
    }
    renderHeadSafe();
    renderList();
  } catch (err) {
    failed = true;
    setError(`Lỗi danh sách sản phẩm: ${err.message}`);
  } finally {
    listBusy = false;
    $('listSentinel').textContent = list.done ? 'Đã hiển thị hết sản phẩm.' : 'Cuộn xuống để xem thêm sản phẩm.';
    if (!failed) maybeLoadMore();
  }
}

// Khi nội dung chưa lấp đầy màn hình (hoặc đang lọc), tự tải thêm cho đến khi đủ.
function maybeLoadMore() {
  if (!$('list').offsetParent) return; // tab sản phẩm đang ẩn
  if ($('listSentinel').getBoundingClientRect().top < window.innerHeight + 300) loadProducts(false);
}

function renderBrandChips() {
  const counts = new Map();
  list.products.forEach((p) => {
    const name = p.brand?.brandName;
    if (name) counts.set(name, (counts.get(name) || 0) + 1);
  });
  const chips = [`<button class="chip ${flt.brand === '' ? 'active' : ''}" data-brand="">Tất cả (${list.products.length})</button>`];
  [...counts.entries()].sort((a, b) => b[1] - a[1]).forEach(([name, count]) => {
    chips.push(`<button class="chip ${flt.brand === name ? 'active' : ''}" data-brand="${escapeHtml(name)}">${escapeHtml(name)} (${count})</button>`);
  });
  $('brandChips').innerHTML = chips.join('');
}

function cardHtml(p) {
  const price = priceOf(p);
  return `
    <button class="product-card" data-code="${escapeHtml(p.productCode)}" data-model="${escapeHtml(p.id)}">
      <img loading="lazy" src="${escapeHtml(p.avatar)}" alt="">
      <div class="pname">${escapeHtml(p.name)}</div>
      <div class="price">${price.price ? fmtVND(price.price) : 'Chưa có giá'}</div>
      ${price.sysPrice > price.price ? `<div class="old">${fmtVND(price.sysPrice)}</div>` : ''}
      <div class="meta">★ ${p.rate ?? '–'} · ${escapeHtml(p.totalSold || '')} · ${(p.totalRate || 0).toLocaleString('vi-VN')} đánh giá</div>
    </button>`;
}

function tableRowHtml(p) {
  const cells = COLUMNS.map((c) => {
    if (c.key === 'name') return `<td><img loading="lazy" src="${escapeHtml(p.avatar)}" alt="">${escapeHtml(p.name)}</td>`;
    const text = c.show ? c.show(p) : c.value(p);
    return `<td class="${c.type === 'num' ? 'num' : ''}">${escapeHtml(text)}</td>`;
  }).join('');
  return `<tr data-code="${escapeHtml(p.productCode)}" data-model="${escapeHtml(p.id)}">${cells}</tr>`;
}

function filterControl(c) {
  if (c.type === 'text') return `<input type="text" data-f="${c.key}" placeholder="Chứa...">`;
  if (c.type === 'select') {
    const options = brandNames().map((n) => `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('');
    return `<select data-f="${c.key}"><option value="">Tất cả</option>${options}</select>`;
  }
  return `<div class="range-group">
      <input type="number" min="0" data-f="${c.key}.min" placeholder="Từ"><span>–</span>
      <input type="number" min="0" data-f="${c.key}.max" placeholder="Đến">
    </div>`;
}

function renderTableHead() {
  $('tableHead').innerHTML = `<tr>${COLUMNS.map((c) => {
    const sorted = listSort?.key === c.key;
    const open = openFilters.has(c.key);
    const arrow = !sorted ? '⇅' : listSort.dir === 'asc' ? '▲' : '▼';
    return `
      <th>
        <div class="th-head">
          <span>${escapeHtml(c.label)}</span>
          <button class="icon ${sorted ? 'on' : ''}" data-sort="${c.key}" title="Sắp xếp">${arrow}</button>
          <button class="icon ${open || isActive(c) ? 'on' : ''}" data-filter="${c.key}" title="Lọc">⚲</button>
        </div>
        ${open ? `<div class="th-filter">${filterControl(c)}</div>` : ''}
      </th>`;
  }).join('')}</tr>`;
}

// Không dựng lại tiêu đề bảng khi người dùng đang gõ trong một ô lọc của bảng.
function renderHeadSafe() {
  if (!$('tableHead').contains(document.activeElement)) renderTableHead();
}

// Ô lọc nào cũng được đồng bộ theo trạng thái, trừ ô đang được gõ.
function syncInputs() {
  document.querySelectorAll('[data-f]').forEach((el) => {
    if (el === document.activeElement) return;
    const [key, bound] = el.dataset.f.split('.');
    el.value = (bound ? flt[key][bound] : flt[key]) ?? '';
  });
}

function renderList() {
  renderBrandChips();
  const items = visibleProducts();
  if (listView === 'table') {
    $('productRows').innerHTML = items.map(tableRowHtml).join('')
      || `<tr><td colspan="${COLUMNS.length}" class="meta">Không có sản phẩm phù hợp.</td></tr>`;
  } else {
    $('productGrid').innerHTML = items.map(cardHtml).join('') || '<p class="meta">Không có sản phẩm phù hợp.</p>';
  }
  const listFallback = $('source').value === 'live' && liveFallbacks.has(LIST_ENDPOINT) ? ' · dữ liệu HAR đã lưu (live lỗi)' : '';
  $('listInfo').textContent = `Hiển thị ${items.length}/${list.products.length} sản phẩm đã tải${listFallback}`;
  syncInputs();
}

function refresh() {
  renderHeadSafe();
  renderList();
  maybeLoadMore();
}

// Xuất các dòng đang hiển thị (đã lọc và sắp xếp) ra file .xlsx.
function exportExcel() {
  if (!window.XLSX) { setError('Không tải được thư viện Excel (cần kết nối tới cdnjs.cloudflare.com).'); return; }
  const items = visibleProducts();
  const header = [...COLUMNS.map((c) => c.label), 'Link'];
  const rows = items.map((p) => [...COLUMNS.map((c) => c.value(p)), `https://www.thegioididong.com/${p.url}`]);
  const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
  ws['!cols'] = header.map((_, i) => ({ wch: i === 0 ? 36 : i === header.length - 1 ? 50 : 16 }));
  ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: rows.length, c: header.length - 1 } }) };
  COLUMNS.forEach((c, col) => {
    if (c.key !== 'price' && c.key !== 'sysPrice') return;
    rows.forEach((_, r) => {
      const cell = ws[XLSX.utils.encode_cell({ r: r + 1, c: col })];
      if (cell) cell.z = '#,##0';
    });
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Sản phẩm');
  XLSX.writeFile(wb, `tgdd-san-pham-${new Date().toISOString().slice(0, 10)}.xlsx`);
}

// ---------- Form ----------
$('search').addEventListener('submit', async (e) => {
  e.preventDefault();
  const productCode = $('productCode').value.trim();
  const modelCode = $('modelCode').value.trim();
  const sellerId = $('sellerId').value;
  const provinceId = $('provinceId').value;
  $('loadBtn').disabled = true;
  setError('');
  setStatus('Đang tải...');
  try {
    await loadDetail(productCode, modelCode, sellerId, provinceId);
    await loadReviews(modelCode, true);
    loadImageCount(modelCode, productCode, sellerId, provinceId);
    const note = $('source').value === 'har'
      ? 'Đang dùng dữ liệu đã lưu từ HAR (chỉ có 2 đánh giá mẫu, bộ lọc không áp dụng).'
      : detailFallbackNote() || `Đã tải lúc ${new Date().toLocaleTimeString('vi-VN')}.`;
    setStatus(note);
  } catch (err) {
    setStatus('');
    setError(`Lỗi: ${err.message}\n\nNếu API trả 403 hoặc không kết nối được, chọn "Dữ liệu đã lưu từ HAR" để xem demo.`);
  } finally {
    $('loadBtn').disabled = false;
  }
});

$('applyFilters').addEventListener('click', () => loadReviews($('modelCode').value.trim(), true));
$('loadMore').addEventListener('click', () => loadReviews($('modelCode').value.trim(), false));

$('reloadList').addEventListener('click', () => loadProducts(true));
$('exportBtn').addEventListener('click', exportExcel);
$('clearFilters').addEventListener('click', () => {
  resetFilters();
  listSort = null;
  refresh();
});

// Ô lọc (tên, khoảng bán/đánh giá/giá, ô lọc trong bảng) đều đi qua data-f.
function onFilterInput(e) {
  const path = e.target.dataset.f;
  if (!path) return;
  const [key, bound] = path.split('.');
  if (bound) flt[key][bound] = e.target.value === '' ? null : Number(e.target.value);
  else flt[key] = e.target.value;
  refresh();
}
$('list').addEventListener('input', onFilterInput);

$('brandChips').addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  flt.brand = chip.dataset.brand;
  refresh();
});

document.querySelectorAll('[data-view]').forEach((btn) => btn.addEventListener('click', () => {
  listView = btn.dataset.view;
  document.querySelectorAll('[data-view]').forEach((b) => b.classList.toggle('on', b === btn));
  $('productGrid').classList.toggle('hidden', listView !== 'cards');
  $('tableWrap').classList.toggle('hidden', listView !== 'table');
  $('exportBtn').classList.toggle('hidden', listView !== 'table');
  refresh();
}));

// Nút sắp xếp (▲ ▼ ⇅) và nút lọc (⚲) trên tiêu đề cột.
$('tableHead').addEventListener('click', (e) => {
  const sortBtn = e.target.closest('[data-sort]');
  const filterBtn = e.target.closest('[data-filter]');
  if (sortBtn) {
    const key = sortBtn.dataset.sort;
    if (listSort?.key !== key) listSort = { key, dir: 'asc' };
    else if (listSort.dir === 'asc') listSort = { key, dir: 'desc' };
    else listSort = null;
  }
  if (filterBtn) {
    const key = filterBtn.dataset.filter;
    if (openFilters.has(key)) openFilters.delete(key);
    else openFilters.add(key);
  }
  if (sortBtn || filterBtn) {
    renderTableHead();
    refresh();
  }
});

// Bấm sản phẩm: điền product/model code, mở tab chi tiết và tải dữ liệu.
function openProduct(productCode, modelCode) {
  $('productCode').value = productCode;
  $('modelCode').value = modelCode;
  document.querySelector('.tab[data-tab="detail"]').click();
  $('search').requestSubmit();
}
$('productGrid').addEventListener('click', (e) => {
  const card = e.target.closest('.product-card');
  if (card) openProduct(card.dataset.code, card.dataset.model);
});
$('productRows').addEventListener('click', (e) => {
  const row = e.target.closest('tr[data-code]');
  if (row) openProduct(row.dataset.code, row.dataset.model);
});

// Cuộn xuống cuối danh sách thì tự tải thêm, không cần bấm nút.
new IntersectionObserver((entries) => {
  if (entries.some((e) => e.isIntersecting)) loadProducts(false);
}, { rootMargin: '300px 0px' }).observe($('listSentinel'));

loadProducts(true);
</script>
